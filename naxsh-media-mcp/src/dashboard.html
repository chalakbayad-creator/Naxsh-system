<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Naxsh Media Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5fb; --panel:#ffffff; --panel2:#f7f8fd; --line:#e3e6f2;
  --text:#121528; --muted:#646a85; --faint:#9aa0bb;
  --accent:#6d4aff; --accent2:#00b3a4; --good:#12a150; --bad:#e5484d; --warn:#d98a00;
  --shadow:0 1px 2px rgba(20,22,50,.05),0 8px 24px rgba(20,22,50,.06);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d17; --panel:#141829; --panel2:#191e33; --line:#252b45;
    --text:#eef0ff; --muted:#a2a8c8; --faint:#6b7194;
    --accent:#8b72ff; --accent2:#2fd4c4; --good:#3ccf7e; --bad:#ff6b70; --warn:#ffb547;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d17; --panel:#141829; --panel2:#191e33; --line:#252b45;
  --text:#eef0ff; --muted:#a2a8c8; --faint:#6b7194;
  --accent:#8b72ff; --accent2:#2fd4c4; --good:#3ccf7e; --bad:#ff6b70; --warn:#ffb547;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Vazirmatn",system-ui,Tahoma,sans-serif; background:var(--bg); color:var(--text);
  background-image:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),
                   radial-gradient(900px 420px at 0% 0%,color-mix(in srgb,var(--accent2) 12%,transparent),transparent 60%);
  background-attachment:fixed; min-height:100vh; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow)}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--text);color:var(--panel)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:340px){.kpis{grid-template-columns:1fr}}
@media (max-width:420px){.kpi .value{font-size:23px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.kpi .label{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .value{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.5px;direction:ltr;text-align:right}
.kpi .hint{color:var(--faint);font-size:12px;margin-top:4px}
.kpi.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 92%,#000),color-mix(in srgb,var(--accent2) 85%,#000));color:#fff;border:0}
.kpi.hero .label,.kpi.hero .hint{color:rgba(255,255,255,.82)}
.two{grid-template-columns:1.6fr 1fr;margin-top:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 small{color:var(--faint);font-weight:500;font-size:12px}
.chart{width:100%;height:240px;position:relative}
.chart svg{width:100%;height:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--panel);font-size:12px;padding:8px 10px;border-radius:10px;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5;transform:translate(50%,-110%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.people{display:flex;flex-direction:column;gap:10px}
.person{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px}
.person .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.person .name{font-weight:700;display:flex;align-items:center;gap:8px}
.person .amt{font-weight:800;direction:ltr}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;border-radius:99px}
.mini{display:flex;gap:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.person.total{background:transparent;border-style:dashed}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--faint);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.job{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:20px}
.job .t{font-size:13px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.job .m{color:var(--faint);font-size:11.5px;margin-top:4px;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.job .m .who{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
@media (max-width:420px){.jobs{grid-template-columns:1fr}}
.full{margin-top:14px}
.job .c{font-weight:800;direction:ltr;text-align:left}
.st{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.st.success{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.st.fail{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.st.pending{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.note{color:var(--faint);font-size:12px;margin-top:18px;line-height:1.8}
.skeleton{animation:pulse 1.2s ease-in-out infinite;background:var(--line);border-radius:8px;height:30px}
@keyframes pulse{50%{opacity:.5}}
.more{margin-top:10px;width:100%;justify-content:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">ن</div>
      <div>
        <h1>داشبۆردی نەخش میدیا</h1>
        <div class="sub" id="sub">بارکردن…</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="theme" title="ڕووناک / تاریک">◐</button>
      <button class="btn" id="refresh">↻ نوێکردنەوە</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="userSeg"></div>
    <div class="seg" id="rangeSeg"></div>
  </div>

  <section class="grid kpis" id="kpis">
    <div class="card"><div class="skeleton"></div></div><div class="card"><div class="skeleton"></div></div>
    <div class="card"><div class="skeleton"></div></div><div class="card"><div class="skeleton"></div></div>
  </section>

  <section class="grid two">
    <div class="card">
      <h2>خەرجیی ڕۆژانە <small id="chartSub">کرێدت</small></h2>
      <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <h2>بەپێی کەس <small>کرێدت</small></h2>
      <div class="people" id="people"></div>
    </div>
  </section>

  <section class="card full">
    <h2>پڕۆژەکان <small id="projCount"></small></h2>
    <div class="tablewrap"><table id="projects"></table></div>
  </section>
  <section class="card full">
    <h2>دوایین کارەکان <small>کرێدت</small></h2>
    <div class="jobs" id="jobs"></div>
    <button class="btn more" id="more" hidden>زیاتر پیشان بدە</button>
  </section>

  <p class="note" id="note"></p>
</div>

<script>
(function(){
  var token = location.pathname.split("/").filter(Boolean)[1] || "";
  var COLORS = ["#7c5cff","#14b8a6","#f59e0b","#ec4899","#3b82f6","#22c55e","#ef4444"];
  var RANGES = [["7","٧ ڕۆژ"],["30","٣٠ ڕۆژ"],["90","٩٠ ڕۆژ"],["all","هەموو کات"]];
  var state = { data:null, user:"all", range:"30", shown:12 };
  try { var saved = JSON.parse(localStorage.getItem("nx-dash")||"{}"); if(saved.range) state.range = saved.range; } catch(e){}
  try { var th = localStorage.getItem("nx-theme"); if(th) document.documentElement.setAttribute("data-theme", th); } catch(e){}

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function fmt(n, d){ if(n==null||isNaN(n)) return "—"; return Number(n).toLocaleString("en-US",{maximumFractionDigits:d==null?1:d}); }
  function usd(c){ var r = state.data ? state.data.credits_per_usd : 200; return "$" + fmt(c / r, 2); }
  function colorOf(u){ var i = state.data.users.indexOf(u); return COLORS[(i<0?state.data.users.length:i) % COLORS.length]; }
  function ago(iso){
    var s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 60) return "ئێستا";
    if (s < 3600) return Math.floor(s/60) + " خولەک لەمەوبەر";
    if (s < 86400) return Math.floor(s/3600) + " کاتژمێر لەمەوبەر";
    return Math.floor(s/86400) + " ڕۆژ لەمەوبەر";
  }
  function save(){ try { localStorage.setItem("nx-dash", JSON.stringify({range:state.range})); } catch(e){} }

  function inRange(j){
    if (state.range === "all") return true;
    return Date.now() - Date.parse(j.t) <= Number(state.range) * 86400000;
  }
  function filtered(){
    return state.data.jobs.filter(function(j){ return inRange(j) && (state.user === "all" || j.u === state.user); });
  }
  function cost(j){ return j.k === "img" && j.s !== "fail" && j.c != null ? j.c : 0; }

  function renderSegs(){
    var d = state.data, us = $("userSeg");
    if (d.me.admin && d.users.length > 1) {
      var h = '<button data-u="all" class="'+(state.user==="all"?"on":"")+'">هەمووان</button>';
      d.users.forEach(function(u){ h += '<button data-u="'+esc(u)+'" class="'+(state.user===u?"on":"")+'"><span class="dot" style="background:'+colorOf(u)+'"></span>'+esc(u)+'</button>'; });
      us.innerHTML = h; us.hidden = false;
    } else us.hidden = true;
    var rs = "";
    RANGES.forEach(function(r){ rs += '<button data-r="'+r[0]+'" class="'+(state.range===r[0]?"on":"")+'">'+r[1]+'</button>'; });
    $("rangeSeg").innerHTML = rs;
  }

  function renderKpis(jobs){
    var d = state.data;
    var spent = jobs.reduce(function(s,j){ return s + cost(j); }, 0);
    var imgs = jobs.filter(function(j){ return j.k === "img" && j.s === "success"; });
    var trs = jobs.filter(function(j){ return j.k === "tr" && j.s === "success"; });
    var fails = jobs.filter(function(j){ return j.s === "fail"; }).length;
    var avg = imgs.length ? imgs.reduce(function(s,j){ return s + (j.c||0); },0) / imgs.length : null;
    var h = "";
    if (d.me.admin) {
      h += '<div class="card kpi hero"><div class="label">◆ کرێدتی ماوەی Kie</div><div class="value">'+fmt(d.balance)+'</div><div class="hint">'+(d.balance==null?"نەتوانرا بخوێنرێتەوە":"≈ "+usd(d.balance)+" · ڕاستەوخۆ لە Kie")+'</div></div>';
    }
    h += '<div class="card kpi"><div class="label">● خەرجکراو لەم ماوەیەدا</div><div class="value">'+fmt(spent)+'</div><div class="hint">≈ '+usd(spent)+' کرێدت</div></div>';
    h += '<div class="card kpi"><div class="label">▣ وێنە</div><div class="value">'+fmt(imgs.length,0)+'</div><div class="hint">'+(avg==null?"—":"تێکڕا "+fmt(avg)+" کرێدت بۆ هەر وێنەیەک")+(fails?" · "+fails+" سەرنەکەوتوو":"")+'</div></div>';
    h += '<div class="card kpi"><div class="label">≋ ترانسکریپت</div><div class="value">'+fmt(trs.length,0)+'</div><div class="hint">Google Gemini · '+fmt(trs.reduce(function(s,j){return s+(j.tok||0);},0)/1000,0)+'K تۆکن</div></div>';
    if (!d.me.admin) {
      var all = d.jobs.reduce(function(s,j){ return s + cost(j); }, 0);
      h += '<div class="card kpi"><div class="label">Σ هەموو کات</div><div class="value">'+fmt(all)+'</div><div class="hint">≈ '+usd(all)+'</div></div>';
    }
    $("kpis").innerHTML = h;
  }

  function renderChart(jobs){
    var d = state.data, days = state.range === "all" ? 60 : Math.min(Number(state.range), 90);
    if (state.range === "all" && d.jobs.length) {
      var first = Date.parse(d.jobs[d.jobs.length-1].t);
      days = Math.max(7, Math.min(120, Math.ceil((Date.now()-first)/86400000)+1));
    }
    var users = state.user === "all" ? d.users : [state.user];
    var buckets = [], today = new Date(); today.setHours(0,0,0,0);
    for (var i = days-1; i >= 0; i--) {
      var dt = new Date(today.getTime() - i*86400000);
      buckets.push({ key: dt.toISOString().slice(0,10), date: dt, by: {} , total: 0 });
    }
    var idx = {}; buckets.forEach(function(b,i){ idx[b.key] = i; });
    jobs.forEach(function(j){
      var dt = new Date(Date.parse(j.t)); dt.setHours(0,0,0,0);
      var b = buckets[idx[dt.toISOString().slice(0,10)]];
      var c = cost(j); if (!b || !c) return;
      b.by[j.u] = (b.by[j.u]||0) + c; b.total += c;
    });
    var max = Math.max.apply(null, buckets.map(function(b){ return b.total; }).concat([1]));
    var nice = Math.pow(10, Math.floor(Math.log10(max))); max = Math.ceil(max / nice) * nice;
    var W = 600, H = 220, padL = 34, padB = 22, cw = (W - padL) / buckets.length, bw = Math.max(2, cw * 0.62);
    var svg = '<svg viewBox="0 0 '+W+' '+(H+padB)+'" preserveAspectRatio="none" role="img" aria-label="daily spend">';
    for (var g = 0; g <= 4; g++) {
      var y = H - (H * g / 4);
      svg += '<line x1="'+padL+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
      svg += '<text x="'+(padL-6)+'" y="'+(y+4)+'" fill="var(--faint)" font-size="10" text-anchor="end" direction="ltr">'+fmt(max*g/4,0)+'</text>';
    }
    // RTL: newest day on the left reads oddly in charts, so time runs left→right like a timeline.
    buckets.forEach(function(b, i){
      var x = padL + i*cw + (cw-bw)/2, yAcc = H;
      users.forEach(function(u){
        var v = b.by[u] || 0; if (!v) return;
        var h = H * v / max; yAcc -= h;
        svg += '<rect x="'+x+'" y="'+yAcc+'" width="'+bw+'" height="'+h+'" rx="'+Math.min(4,bw/2)+'" fill="'+colorOf(u)+'"/>';
      });
      svg += '<rect class="hit" data-i="'+i+'" x="'+(padL+i*cw)+'" y="0" width="'+cw+'" height="'+H+'" fill="transparent"/>';
      var step = Math.ceil(buckets.length / 8);
      if (i % step === 0 || (i === buckets.length-1 && (buckets.length-1) % step >= step/2)) {
        svg += '<text x="'+(x+bw/2)+'" y="'+(H+16)+'" fill="var(--faint)" font-size="10" text-anchor="middle" direction="ltr">'+(b.date.getMonth()+1)+'/'+b.date.getDate()+'</text>';
      }
    });
    svg += '</svg>';
    var el = $("chart"); el.innerHTML = svg + '<div class="tip" id="tip"></div>';
    var tip = $("tip");
    el.querySelectorAll(".hit").forEach(function(r){
      r.addEventListener("mouseenter", function(ev){
        var b = buckets[Number(r.getAttribute("data-i"))];
        var lines = '<b>'+b.key+'</b> — '+fmt(b.total)+' کرێدت';
        users.forEach(function(u){ if (b.by[u]) lines += '<br><span class="dot" style="background:'+colorOf(u)+'"></span> '+esc(u)+': '+fmt(b.by[u]); });
        tip.innerHTML = lines; tip.style.opacity = 1;
        var box = el.getBoundingClientRect(), rb = r.getBoundingClientRect();
        tip.style.left = (rb.left - box.left + rb.width/2) + "px"; tip.style.top = "40px";
      });
      r.addEventListener("mouseleave", function(){ tip.style.opacity = 0; });
    });
    $("legend").innerHTML = users.map(function(u){ return '<span><span class="dot" style="background:'+colorOf(u)+'"></span> '+esc(u)+'</span>'; }).join("");
  }

  function renderPeople(jobs){
    var d = state.data, rows = [], total = 0;
    var users = d.me.admin ? d.users : [d.me.name];
    users.forEach(function(u){
      var mine = jobs.filter(function(j){ return j.u === u; });
      var c = mine.reduce(function(s,j){ return s + cost(j); }, 0); total += c;
      rows.push({ u:u, c:c, img: mine.filter(function(j){return j.k==="img"&&j.s==="success";}).length,
        tr: mine.filter(function(j){return j.k==="tr"&&j.s==="success";}).length,
        last: mine.length ? mine[0].t : null });
    });
    var h = "";
    rows.forEach(function(r){
      var pct = total ? Math.round(r.c / total * 100) : 0;
      h += '<div class="person"><div class="top"><div class="name"><span class="dot" style="background:'+colorOf(r.u)+'"></span>'+esc(r.u)+(r.u===d.me.name?' <span class="badge">تۆ</span>':'')+'</div><div class="amt">'+fmt(r.c)+'</div></div>'
        + '<div class="bar"><i style="width:'+pct+'%;background:'+colorOf(r.u)+'"></i></div>'
        + '<div class="mini"><span>'+pct+'٪ لە کۆ</span><span>≈ '+usd(r.c)+'</span><span>▣ '+r.img+' وێنە</span><span>≋ '+r.tr+' ترانسکریپت</span><span>'+(r.last?ago(r.last):"هێشتا هیچ")+'</span></div></div>';
    });
    if (rows.length > 1) {
      h += '<div class="person total"><div class="top"><div class="name">Σ کۆی گشتی</div><div class="amt">'+fmt(total)+'</div></div><div class="mini"><span>≈ '+usd(total)+'</span><span>▣ '+rows.reduce(function(s,r){return s+r.img;},0)+' وێنە</span><span>≋ '+rows.reduce(function(s,r){return s+r.tr;},0)+' ترانسکریپت</span></div></div>';
    }
    $("people").innerHTML = h;
  }

  var projSort = { k:"c", dir:-1 };
  function renderProjects(jobs){
    var map = {};
    jobs.forEach(function(j){
      var p = map[j.p] || (map[j.p] = { p:j.p, c:0, img:0, tr:0, users:{}, last:j.t });
      p.c += cost(j); if (j.k==="img"&&j.s==="success") p.img++; if (j.k==="tr"&&j.s==="success") p.tr++;
      p.users[j.u] = (p.users[j.u]||0) + cost(j); if (j.t > p.last) p.last = j.t;
    });
    var list = Object.keys(map).map(function(k){ return map[k]; });
    list.sort(function(a,b){ var x=a[projSort.k], y=b[projSort.k]; return (x>y?1:x<y?-1:0)*projSort.dir; });
    $("projCount").textContent = list.length + " پڕۆژە";
    if (!list.length) { $("projects").innerHTML = '<tr><td class="empty">هێشتا هیچ پڕۆژەیەک نییە</td></tr>'; return; }
    var h = '<thead><tr><th data-k="p">پڕۆژە</th><th data-k="c">کرێدت</th><th data-k="img">وێنە</th><th data-k="tr">ترانسکریپت</th><th data-k="last">دوایین</th></tr></thead><tbody>';
    list.forEach(function(p){
      var dots = Object.keys(p.users).map(function(u){ return '<span class="dot" title="'+esc(u)+': '+fmt(p.users[u])+'" style="background:'+colorOf(u)+'"></span>'; }).join(" ");
      h += '<tr><td><div style="font-weight:600">'+esc(p.p)+'</div><div style="margin-top:4px">'+dots+'</div></td><td class="num"><b>'+fmt(p.c)+'</b><div style="color:var(--faint);font-size:11px">≈ '+usd(p.c)+'</div></td><td class="num">'+p.img+'</td><td class="num">'+p.tr+'</td><td style="color:var(--muted);font-size:12px;white-space:nowrap">'+ago(p.last)+'</td></tr>';
    });
    $("projects").innerHTML = h + '</tbody>';
    $("projects").querySelectorAll("th").forEach(function(th){
      th.addEventListener("click", function(){ var k = th.getAttribute("data-k"); projSort = { k:k, dir: projSort.k===k ? -projSort.dir : -1 }; renderProjects(filtered()); });
    });
  }

  function renderJobs(jobs){
    var list = jobs.slice(0, state.shown);
    if (!list.length) { $("jobs").innerHTML = '<div class="empty">لەم ماوەیەدا هیچ کارێک نییە</div>'; $("more").hidden = true; return; }
    var stLabel = { success:"تەواو", fail:"سەرنەکەوتوو", pending:"لە کاردایە" };
    $("jobs").innerHTML = list.map(function(j){
      var thumb = j.img ? '<img class="thumb" loading="lazy" src="'+esc(j.img)+'" alt="">' : '<div class="thumb">'+(j.k==="tr"?"≋":"▣")+'</div>';
      var c = j.k === "img" ? (j.s === "fail" ? "0" : (j.c==null ? "?" : (j.est?"≈":"") + fmt(j.c))) : "—";
      var model = (j.m||"").replace("gpt-image-","GPT ").replace("-image-to-image"," · ئیدیت").replace("-text-to-image","").replace(/-/g," ");
      return '<div class="job">'+thumb+'<div><div class="t">'+esc(j.n)+'</div><div class="m"><span class="who"><span class="dot" style="background:'+colorOf(j.u)+'"></span>'+esc(j.u)+'</span><span>'+esc(j.p)+'</span><span>'+esc(model)+(j.r?' · '+esc(j.r):'')+'</span><span>'+ago(j.t)+'</span><span class="st '+j.s+'">'+stLabel[j.s]+'</span></div></div><div class="c">'+c+'</div></div>';
    }).join("");
    $("more").hidden = jobs.length <= state.shown;
  }

  function render(){
    var d = state.data;
    $("sub").textContent = (d.me.admin ? "ئەدمین · " : "") + d.me.name + " · نوێکرایەوە " + new Date(d.generated).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    renderSegs();
    var jobs = filtered();
    renderKpis(jobs); renderChart(jobs); renderPeople(jobs); renderProjects(jobs); renderJobs(jobs);
    $("note").innerHTML = "• کرێدتی هەر وێنەیەک بە جیاوازیی باڵانسی Kie پێش و دوای کارەکە دەپێورێت. نیشانەی ≈ واتە خەمڵاندنە لە کارە پێشووەکانی هەمان مۆدێل. وێنە سەرنەکەوتووەکان کرێدتیان بۆ دەگەڕێتەوە.<br>• نرخی دۆلار نزیکەییە (" + d.credits_per_usd + " کرێدت = $1). ترانسکریپت لەسەر Google ـە و کرێدتی Kie ناخوات.<br>• تەنها ئەو کارانە لێرە دەردەکەون کە لە ڕێگەی ئەم سێرڤەرەوە کراون.";
  }

  function load(){
    $("refresh").disabled = true;
    fetch("/api/dashboard/" + encodeURIComponent(token), { cache:"no-store" })
      .then(function(r){ if (!r.ok) throw new Error(r.status === 401 ? "لینکەکە هەڵەیە" : "HTTP " + r.status); return r.json(); })
      .then(function(d){ state.data = d; if (!d.me.admin) state.user = d.me.name; render(); })
      .catch(function(e){ $("sub").textContent = "هەڵە: " + e.message; })
      .then(function(){ $("refresh").disabled = false; });
  }

  document.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.u) { state.user = b.dataset.u; state.shown = 12; render(); }
    else if (b.dataset.r) { state.range = b.dataset.r; state.shown = 12; save(); render(); }
    else if (b.id === "refresh") load();
    else if (b.id === "more") { state.shown += 20; renderJobs(filtered()); }
    else if (b.id === "theme") {
      var cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var nx = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nx);
      try { localStorage.setItem("nx-theme", nx); } catch(err){}
    }
  });
  load();
  setInterval(function(){ if (!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
